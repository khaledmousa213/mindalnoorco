backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "page"
    label: "My Website"
    files:
      - file: "public/index.html"
        label: "Homepage"
        name: "home"
        fields:
          - { name: title, label: "Page Title", widget: string }
          - { name: body, label: "Content", widget: text }